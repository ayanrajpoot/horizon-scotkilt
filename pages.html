      { id:'tartan', h2:'Choosing the tartan for a hybrid kilt', html:`<p>Because only the pleats are tartan, high-contrast setts work best — they read clearly even in the narrow pleat faces. ${L('/tartans/black-watch','Black Watch')} is the quiet classic; ${L('/tartans/royal-stewart','Royal Stewart')} is the bold one; ${L('/tartans/grey-highlander','Grey Highlander')} and ${L('/tartans/menzies-black-white','Menzies Black &amp; White')} pair naturally with the black apron; ${L('/tartans/stewart-black','Stewart Black')} gives an almost monochrome look with fine coloured lines.</p>` },
      { id:'compare', h2:'Hybrid vs utility vs tartan', html:`<p>Choose a ${L('/kilts/tartan','tartan kilt')} for the full traditional look with no pockets, a ${L('/kilts/utility','utility kilt')} for maximum practicality with no tartan, and a hybrid when you want both. Hybrids are also the easiest tartan kilt to care for: spot-clean the pleats, and the canvas apron shrugs off most wear.</p>` },
      { id:'style', h2:'How to wear a hybrid kilt', html:`<p>Treat it like a utility kilt: plain tee or shirt, denim or leather jacket, boots, a wide belt. Because the apron is black, almost any top works. No sporran is needed — the pockets do the job — though a day sporran looks right if you prefer it.</p>` },
      CARE_BLOCK,
    ],
    faqs:[
      { q:'Do hybrid kilts have pockets?', a:'Yes — two front pockets in the canvas apron and usually a hidden interior pocket.' },
      { q:'Which tartans are available as hybrid kilts?', a:'Black Watch, Royal Stewart, Grey Highlander, Stewart Black and Menzies Black & White at launch. Contact us for other setts.' },
      { q:'Can I machine wash a hybrid kilt?', a:'Spot-clean the tartan pleats and wipe the canvas apron. A cool, gentle machine wash is possible for some cloths — check the product label first.' },
      { q:'Is a hybrid kilt formal?', a:'No, it is a casual style. For formal wear choose a traditional 8-yard kilt.' },
      { q:'How should a hybrid kilt fit?', a:'Worn at or just above the hip, finishing at or just above the kneecap. Order by waist; the strap adjusts about two inches.' },
      { q:'What is the apron made of?', a:'Cotton canvas, in black across this collection so it pairs with any tartan.' },
    ],
  },

  '/kilts/contemporary': {
    mode:'products', filter:p => p.category === 'contemporary', eyebrow:'Kilts', h1:'Contemporary Kilts for Men', parent:{label:'Kilts', path:'/kilts'},
    metaTitle:'Contemporary Kilts for Men | Solid-Colour Modern Kilts | SCOTKILT',
    metaDesc:'Shop contemporary kilts for men in charcoal, black, navy and stone wool blend. Clean lines, tailored waist and minimal hardware — a kilt for everyday menswear.',
    intro:'Solid-colour kilts in charcoal, black, navy and stone wool blend, with a tailored waistband, hidden closure and minimal hardware. Contemporary kilts are designed to be worn as menswear first — with knitwear, shirts and jackets — and Highland dress second.',
    hero:{fabric:'charcoal'}, heroAlt:'Charcoal contemporary kilt with clean knife pleats and minimal hardware',
    chips:[{label:'Charcoal', colour:'grey'},{label:'Black', colour:'black'},{label:'Navy', colour:'blue'},{label:'Stone', colour:'brown'},{label:'SCOTKILT Charcoal tartan →', path:'/tartans/scotkilt-charcoal'}],
    relatedTartans:t => t.family === 'Fashion' || t.id === 'douglas',
    content:[
      { id:'what', h2:'What is a contemporary kilt?', html:`<p>A contemporary kilt is a kilt without a tartan: solid cloth, knife pleats, a flat apron and a clean waistband with the hardware hidden or reduced to a single buckle. It keeps everything that makes a kilt a kilt and removes everything that makes it read as costume. The result is a garment that sits in a wardrobe next to chinos and denim.</p>` },
      { id:'cloth', h2:'Cloth and colours', html:`<p>These kilts are cut from an 11oz wool-blend suiting: enough body to pleat cleanly, light enough for all-day wear and travel. Charcoal is the flagship — it takes a white shirt, a grey knit or a navy blazer equally well. Black is sharper and works for evening. Navy is the smart-casual option; stone is the summer one. Our house tartan, ${L('/tartans/scotkilt-charcoal','SCOTKILT Charcoal')}, was designed to sit alongside this range for people who want a hint of pattern.</p>` },
      { id:'wear', h2:'Wearing a kilt as menswear', html:WEAR_LIST(['<strong>Office</strong> — charcoal kilt, white or pale blue shirt, navy blazer, dark hose or fine socks, leather brogues.','<strong>Dinner</strong> — black kilt, black roll-neck or shirt, black boots, single-buckle belt.','<strong>Weekend</strong> — stone or navy kilt, chambray shirt or crew-neck sweater, white trainers or desert boots.','<strong>Layered</strong> — any colour with an overshirt or field jacket; contemporary kilts are cut a touch straighter, so outerwear sits cleanly over the waist.']) },
      { id:'fit', h2:'Fit and length', html:`<p>Contemporary kilts are worn at the natural waist or just below, with a straighter cut through the pleats than a traditional kilt. Length is a personal choice: at the top of the knee is classic; an inch above reads more modern. Measure your waist where you will wear it and the drop to your chosen point, then use the ${L('/size-guide','size guide')}.</p>` },
      { id:'between', h2:'Between traditional and fashion', html:`<p>If you want the heritage, go to ${L('/kilts/traditional','traditional kilts')}. If you want tartan with pockets, go to ${L('/kilts/hybrid','hybrid kilts')}. Contemporary kilts are for people who like the shape of a kilt and want to wear it the way they wear the rest of their clothes — quietly, often, without explanation.</p>` },
      CARE_BLOCK,
    ],
    faqs:[
      { q:'Do contemporary kilts have pockets?', a:'A hidden interior pocket in the apron on most styles. They are cut clean on the outside to keep the tailored line.' },
      { q:'Are contemporary kilts made of wool?', a:'An 11oz wool-blend suiting cloth in this collection. Confirm the exact composition on each product page.' },
      { q:'Can I wear a contemporary kilt to work?', a:'Yes — charcoal or navy with a shirt and blazer is the usual combination.' },
      { q:'How is a contemporary kilt different from a utility kilt?', a:'Cloth and cut. Utility kilts are cotton canvas with cargo pockets and a workwear look; contemporary kilts are wool-blend suiting with a tailored waist and no external pockets.' },
      { q:'What length should a contemporary kilt be?', a:'Top of the knee for a classic line, or an inch above for a more modern look.' },
      { q:'How do I care for a wool-blend kilt?', a:'Dry-clean, hang by the straps, and steam rather than iron the pleats.' },
    ],
  },

  '/kilts/traditional': {
    mode:'products', filter:p => p.category === 'traditional', eyebrow:'Kilts', h1:'Traditional Scottish Kilts', parent:{label:'Kilts', path:'/kilts'},
    metaTitle:'Traditional Scottish Kilts | 8-Yard Wedding Kilts | SCOTKILT',
    metaDesc:'Shop traditional Scottish kilts: 8-yard, 16oz tartan kilts with deep knife pleats and fringed aprons for weddings and Highland dress. Black Watch, Gordon.',
    intro:'Full 8-yard traditional kilts in 16oz tartan with deep knife pleats, a fringed apron edge and three leather straps. The kilt for weddings, Burns suppers, ceilidhs and formal Highland dress — in Black Watch, Royal Stewart, Gordon, MacKenzie, Wallace and Buchanan.',
    hero:{tartan:'black-watch', fringe:true}, heroAlt:'Traditional 8-yard Black Watch kilt with fringed apron and deep knife pleats',
    chips:[{tartan:'black-watch'},{tartan:'royal-stewart'},{tartan:'gordon'},{tartan:'mackenzie'},{tartan:'wallace'},{tartan:'buchanan'},{label:'5-yard casual →', path:'/kilts/tartan'}],
    relatedTartans:t => PRODUCTS.some(p => p.category === 'traditional' && p.tartan === t.id) || t.family === 'Clan',
    content:[
      { id:'what', h2:'What makes a kilt traditional?', html:`<p>Cloth and construction. A traditional kilt is made from eight yards of 16oz tartan, pleated by hand or with hand-finished detail, with the pleats stitched down through the fell and left to swing below. The outer apron is fringed along its edge; three straps fasten it. It is the garment worn by pipe bands, at Highland games and at every Scottish wedding you have seen — and it is the one style in the range built to be passed on.</p>` },
      { id:'anatomy', h2:'Eight yards, the pleats and the fringe', html:`<ul><li><strong>Eight yards</strong> of cloth produce around 30 deep knife pleats, each showing the sett or a single stripe depending on how the kilt was pleated.</li><li><strong>16oz cloth</strong> is the heavy kilting weight: it hangs straight, swings on the turn and resists creasing.</li><li><strong>The fell</strong> is the stitched section from waist to hip that shapes the kilt over the seat.</li><li><strong>The fringe</strong> on the apron edge is a mark of a hand-finished traditional kilt.</li><li><strong>Three straps</strong> — two at the right hip, one at the left — set the fit.</li></ul>` },
      { id:'wedding', h2:'Wedding kilts and formal Highland dress', html:`<p>For a wedding party, the groom and groomsmen usually wear the same tartan in traditional 8-yard kilts, with a Prince Charlie jacket and waistcoat for black-tie, or an Argyll jacket for a day wedding. Add a dress ${L('/accessories/sporrans','sporran')}, cream or charcoal ${L('/accessories/socks','kilt hose')} with ${L('/accessories/flashes','flashes')}, ghillie brogues and a ${L('/accessories/kilt-pins','kilt pin')}. Guests can wear any traditional or casual tartan kilt with a jacket.</p><div class="callout"><strong>Ordering for a wedding party?</strong>Order the same tartan and cloth weight together so the setts match, and allow time for exchanges on sizing.</div>` },
      { id:'tartan', h2:'Choosing a clan tartan for a traditional kilt', html:`<p>A traditional kilt shows the most cloth, so this is where a clan sett shines. ${L('/tartans/gordon','Gordon')}, ${L('/tartans/mackenzie','MacKenzie')}, ${L('/tartans/wallace','Wallace')} and ${L('/tartans/buchanan','Buchanan')} all pleat beautifully across eight yards. If you have no clan, ${L('/tartans/black-watch','Black Watch')} is the universal traditional choice and ${L('/tartans/royal-stewart','Royal Stewart')} the bold one. Browse all ${L('/tartans/clan','clan tartans')} or use the ${L('/tartan-finder','Tartan Finder')}.</p>` },
      { id:'measure', h2:'Measuring for an 8-yard kilt', html:`<p>Three measurements: <strong>waist</strong> at the navel (a traditional kilt sits high), <strong>seat</strong> at the widest point of the hips, and <strong>drop</strong> from the waist to the top of the kneecap. Order by waist; the seat measurement tells us how much the pleats need to flare, and the drop sets the length. The full ${L('/size-guide','size guide')} includes diagrams and the chart for this style.</p>` },
      CARE_BLOCK,
    ],
    faqs:[
      { q:'What is the difference between an 8-yard and a 5-yard kilt?', a:'Cloth. An 8-yard kilt has roughly twice the pleating, a deeper swing and a heavier, formal drape. A 5-yard kilt is lighter and cheaper for everyday wear.' },
      { q:'What should I wear to a wedding with a traditional kilt?', a:'A Prince Charlie jacket and waistcoat for black-tie, or an Argyll jacket for daytime, with a dress sporran, kilt hose and flashes, ghillie brogues and a kilt pin.' },
      { q:'Which tartan should a groom wear?', a:'A family tartan if he has one; otherwise Black Watch, Royal Stewart or a tartan matching the wedding colours. The wedding party normally wears the same sett.' },
      { q:'How should a traditional kilt fit?', a:'High on the waist at the navel, finishing at the top of the kneecap. It should feel snug at the waist and hang straight over the seat.' },
      { q:'How much does a traditional kilt weigh?', a:'Around two kilograms (4–5 lb) in 16oz cloth, depending on size.' },
      { q:'Can a traditional kilt be altered?', a:'Waist adjustments of a few inches are possible via the straps and, for larger changes, by a kilt maker. Length is more difficult because of the fell.' },
    ],
  },

function tartanCollection(path, o){

}
const COLOUR_CHIPS = [['Red','/tartans/red','royal-stewart'],['Black','/tartans/black','stewart-black'],['Green','/tartans/green','irish-national'],['Blue','/tartans/blue','black-watch'],['Brown','/tartans/brown','weathered-brown'],['Modern','/tartans/modern','grey-highlander'],['Clan','/tartans/clan','gordon'],['Popular','/tartans/popular','mackenzie']];
const TARTAN_FAQS_COMMON = [
  { q:'Can I wear any of these tartans?', a:'Yes. No tartan is legally restricted. Clan tartans carry a family association but are worn by anyone; universal and fashion tartans have no association at all.' },
  { q:'Which kilt styles are available in each tartan?', a:'Most tartans can be made as a 5-yard casual kilt, an 8-yard traditional kilt or a hybrid. Each tartan page lists the kilts currently in stock.' },
  { q:'What is a sett?', a:'The sett is the repeating block of the tartan pattern — the sequence of coloured stripes that mirrors and repeats in both directions.' },
  { q:'My clan tartan is not listed. Can you make it?', a:'The range grows continually. Contact us with the tartan name and we will confirm availability.' },
];
tartanCollection('/tartans', { filter:() => true, h1:'Scottish Tartans', metaTitle:'Scottish Tartans for Kilts | Clan & Universal Tartans | SCOTKILT',
  metaDesc:'Browse Scottish tartans for kilts at SCOTKILT: clan tartans, universal setts like Black Watch, royal tartans and modern fashion tartans, by colour and family.',
  intro:'Every tartan available across our kilt styles — clan setts, universal tartans, royal tartans and modern fashion designs — with a short history of each and the kilts currently made in it. Browse by colour or family, or use the Tartan Finder.',
  hero:'mackenzie', heroAlt:'MacKenzie tartan fabric swatch',
  content:[
    { id:'what', h2:'What is a tartan?', html:`<p>A tartan is a woven pattern of coloured stripes crossing at right angles. The sequence — the sett — repeats and mirrors in both warp and weft, producing the blocks and lines you see. Traditionally woven in wool twill, tartans are recorded by name in registers and associated with clans, regions, regiments and institutions, though many modern tartans are simply designs.</p>` },
    { id:'families', h2:'Clan, universal, royal and fashion tartans', html:`<ul><li>${L('/tartans/clan','<strong>Clan tartans</strong>')} — Gordon, MacKenzie, Cameron, Wallace, Douglas, Buchanan, MacLeod, Menzies, Stewart and hundreds more.</li><li><strong>Universal tartans</strong> — Black Watch and others anyone may wear.</li><li><strong>Royal tartans</strong> — Royal Stewart, the tartan of the royal house and the monarch.</li><li>${L('/tartans/modern','<strong>Fashion tartans</strong>')} — modern designs chosen for colour: Grey Highlander, Weathered Brown, SCOTKILT Charcoal.</li></ul>` },
    { id:'colour', h2:'Browse tartans by colour', html:`<p>If you think in colours rather than names: ${L('/tartans/red','red tartans')} are the boldest and the most traditional for celebrations; ${L('/tartans/green','green')} and ${L('/tartans/blue','blue')} setts are the quietest and the most worn; ${L('/tartans/black','black')} tartans suit evening wear; ${L('/tartans/brown','brown')} and weathered setts read like tweed. Modern greys pair with almost any wardrobe.</p>` },
  ], faqs:TARTAN_FAQS_COMMON });
tartanCollection('/tartans/popular', { filter:t => t.popular, h1:'Popular Tartans', metaTitle:'Popular Tartans for Kilts | SCOTKILT', metaDesc:'The most popular tartans for kilts: Black Watch, Royal Stewart, MacKenzie, Gordon, Irish National and more, with the kilts made in each.',
  intro:'The tartans most often chosen for kilts — universal setts, the big clan names and the modern greys that first-time buyers reach for.', hero:'royal-stewart', heroAlt:'Royal Stewart tartan swatch',
  content:[ { id:'why', h2:'Why these tartans are popular', html:`<p>Recognition and flexibility. Black Watch and Royal Stewart are known worldwide; MacKenzie, Gordon and Cameron are large clans with strong military histories; Irish National gives Irish customers a tartan of their own; Grey Highlander works with everything. Each is available in more than one ${L('/kilts','kilt style')}.</p>` } ], faqs:TARTAN_FAQS_COMMON });
tartanCollection('/tartans/trending', { filter:t => t.trending, h1:'Trending Tartans', metaTitle:'Trending Tartans for Kilts | SCOTKILT', metaDesc:'Tartans trending right now for kilts, flagged from what customers are viewing and ordering across the SCOTKILT range.',
  intro:'Tartans flagged as trending from what customers are viewing and ordering. The list changes; the histories do not.', hero:'wallace', heroAlt:'Wallace tartan swatch',
  content:[ { id:'how', h2:'How trending is measured', html:`<p>Once the store is connected, trending is set from views and orders over the previous 30 days. In this preview the flags are manual. See ${L('/tartans/popular','popular tartans')} for the long-run favourites.</p>` } ], faqs:TARTAN_FAQS_COMMON });
tartanCollection('/tartans/clan', { filter:t => t.family === 'Clan', h1:'Clan Tartans', metaTitle:'Clan Tartans for Kilts | Scottish Family Tartans | SCOTKILT', metaDesc:'Scottish clan tartans for kilts: MacKenzie, Gordon, Wallace, Cameron, Buchanan, Douglas, MacLeod, Menzies and Stewart. Histories and kilts for each clan sett.',
  intro:'Tartans associated with Scottish clans and families, each with a short history and the kilts currently made in it. Anyone may wear a clan tartan; a family link is a reason, not a rule.', hero:'gordon', heroAlt:'Gordon clan tartan swatch',
  content:[
    { id:'what', h2:'What is a clan tartan?', html:`<p>A tartan recorded under a clan or family name. Many date from the early nineteenth century when tartans were first catalogued; some, like Gordon and MacKenzie, are regimental setts adopted by the clan; others were designed later for families who had none. Most clans have several variants — modern, ancient, hunting, dress — that share a sett and change the colours.</p>` },
    { id:'variants', h2:'Modern, ancient, hunting and dress', html:`<ul><li><strong>Modern</strong> — strong, dark chemical-dye colours; the default for most clan kilts.</li><li><strong>Ancient</strong> — the same sett in lighter tones imitating vegetable dyes.</li><li><strong>Hunting</strong> — a green or brown ground version for country wear.</li><li><strong>Dress</strong> — a white ground version, historically for women and dancers, now worn by anyone.</li></ul><p>Where SCOTKILT lists a single version, it is the modern colourway unless the name says otherwise.</p>` },
    { id:'choose', h2:'Finding your clan tartan', html:`<p>Search by surname first, then by the septs (associated families) of the larger clans. If nothing matches, a district tartan for the area your family came from, or a universal sett such as ${L('/tartans/black-watch','Black Watch')}, is the traditional fallback. The ${L('/tartan-finder','Tartan Finder')} narrows the range by colour and family.</p>` },
  ], faqs:TARTAN_FAQS_COMMON });
tartanCollection('/tartans/scottish', { filter:t => t.family !== 'National', h1:'Scottish Tartans', metaTitle:'Scottish Tartans | Clan, Royal & Universal Setts | SCOTKILT', metaDesc:'Scottish clan, royal and universal tartans for kilts, from Black Watch and Royal Stewart to Gordon, MacKenzie and Wallace.',
  intro:'Clan, royal and universal Scottish tartans in one collection — the setts with a Scottish history behind them.', hero:'black-watch', heroAlt:'Black Watch tartan swatch',
  content:[ { id:'what', h2:'Scottish tartans and the register', html:`<p>Scottish tartans are recorded in the Scottish Register of Tartans, which holds thousands of setts: clan and family tartans, district tartans for regions and towns, regimental tartans, and corporate and commemorative designs. The tartans here are the clan, royal and universal setts most often made into kilts.</p>` } ], faqs:TARTAN_FAQS_COMMON });
const colourPage = (colour, h1, meta, intro, heroId, blocks) => tartanCollection('/tartans/' + colour, { filter:t => t.colours.includes(colour === 'modern' ? '__' : colour) || (colour === 'modern' && t.family === 'Fashion'), h1, metaTitle:meta[0], metaDesc:meta[1], intro, hero:heroId, heroAlt:h1 + ' — tartan swatch', content:blocks, faqs:TARTAN_FAQS_COMMON });
colourPage('red', 'Red Tartans', ['Red Tartans for Kilts | Royal Stewart, Wallace, Cameron | SCOTKILT', 'Red tartans for kilts: Royal Stewart, Wallace, Cameron, Buchanan and Stewart Black. The boldest setts for weddings, celebrations and statement kilts.'],
  'The boldest colour in the register. Red-ground setts — Royal Stewart, Wallace, Cameron — and tartans with strong red lines, for weddings, celebrations and kilts that are meant to be seen.', 'royal-stewart',
  [ { id:'about', h2:'About red tartans', html:`<p>Red was the most expensive dye in the Highlands, which is why red tartans became the colour of celebration and status. ${L('/tartans/royal-stewart','Royal Stewart')} is the reference red; ${L('/tartans/cameron','Cameron')} and ${L('/tartans/wallace','Wallace')} are the great clan reds; ${L('/tartans/stewart-black','Stewart Black')} keeps the red lines on a black ground for evening wear.</p>` }, { id:'wear', h2:'Wearing a red tartan kilt', html:`<p>Red pleats read strongly, so keep the rest simple: a white or black shirt, a charcoal or navy jacket, black hose. Red tartans are the classic wedding and Hogmanay choice and work in both ${L('/kilts/traditional','traditional')} and ${L('/kilts/tartan','casual')} weights.</p>` } ]);
colourPage('black', 'Black Tartans', ['Black Tartans for Kilts | Stewart Black, Menzies | SCOTKILT', 'Black tartans for kilts: Stewart Black, Menzies Black & White, Wallace, MacLeod of Lewis and SCOTKILT Charcoal. Monochrome and black-ground setts for evening wear.'],
  'Black-ground and monochrome setts — Stewart Black, Menzies Black & White, SCOTKILT Charcoal — and tartans where black carries the pattern. The evening-wear end of the range.', 'stewart-black',
  [ { id:'about', h2:'About black tartans', html:`<p>Black-ground tartans are a modern preference: they keep the fine coloured lines of a clan sett on a ground that reads as formal wear. ${L('/tartans/stewart-black','Stewart Black')} is the best known; ${L('/tartans/menzies-black-white','Menzies')} is the striking monochrome; our own ${L('/tartans/scotkilt-charcoal','SCOTKILT Charcoal')} is the quietest of all.</p>` }, { id:'wear', h2:'Wearing a black tartan kilt', html:`<p>Black tartans suit dinner, black-tie and stage. Pair with a black or white shirt and let the lines do the work. They are also the natural choice for ${L('/kilts/hybrid','hybrid kilts')} with a black apron.</p>` } ]);
colourPage('green', 'Green Tartans', ['Green Tartans for Kilts | Black Watch, Irish National | SCOTKILT', 'Green tartans for kilts: Black Watch, Irish National, MacKenzie, Gordon, Cameron and Douglas. Green-ground and hunting setts for everyday and country wear.'],
  'Green-ground and hunting setts — Black Watch, Irish National, MacKenzie — and tartans where green carries the pattern. The most worn colour family and the easiest to style.', 'irish-national',
  [ { id:'about', h2:'About green tartans', html:`<p>Green is the ground of the Government sett, ${L('/tartans/black-watch','Black Watch')}, and of most hunting tartans, which were designed to be worn in the countryside. ${L('/tartans/irish-national','Irish National')} gives Irish customers a green of their own; ${L('/tartans/mackenzie','MacKenzie')} and ${L('/tartans/gordon','Gordon')} balance green with navy.</p>` }, { id:'wear', h2:'Wearing a green tartan kilt', html:`<p>Green tartans go with tweed, brown leather and cream hose — the country look — and just as easily with denim and a grey sweatshirt. They are the safest choice for a first ${L('/kilts/tartan','tartan kilt')}.</p>` } ]);

/* ---------- 4. State + list logic ---------------------------------------- */
const FILTER_DEFS = {
  products: [
    { key:'family', label:'Tartan family', get:p => p.family ? [p.family] : [] },
    { key:'colour', label:'Colour', get:p => p.colours, dots:{red:'#8c2a2f',black:'#232220',green:'#2f4a3b',blue:'#27354f',yellow:'#c9a53a',grey:'#8c8d89',brown:'#674730',white:'#ece7db'} },
    { key:'build', label:'Build', get:p => [p.build] },
    { key:'tag', label:'Highlights', get:p => [p.badge].filter(Boolean) },
  ],
  tartans: [
    { key:'family', label:'Family', get:t => [t.family] },
    { key:'colour', label:'Colour', get:t => t.colours, dots:{red:'#8c2a2f',black:'#232220',green:'#2f4a3b',blue:'#27354f',yellow:'#c9a53a',grey:'#8c8d89',brown:'#674730',white:'#ece7db'} },
  ],
};
const PRICE_BANDS = [ ['Under $150', 0, 149.99], ['$150 – $250', 150, 250], ['$250 – $400', 250.01, 400], ['$400 and up', 400.01, 1e9] ];
const cat = { path:null, sel:{}, price:null, size:null, sort:'featured', shown:12, PAGE:12 };
function catConfig(path){ return CATEGORY_PAGES[path] || null; }
function catReset(path){ cat.path = path; cat.sel = {}; cat.price = null; cat.size = null; cat.sort = 'featured'; cat.shown = cat.PAGE; }
function catBase(cfg){ return cfg.mode === 'products' ? PRODUCTS.filter(cfg.filter) : TARTANS.filter(cfg.filter); }
function catFiltered(cfg){
  const defs = FILTER_DEFS[cfg.mode];
  let list = catBase(cfg).filter(item => defs.every(d => { const s = cat.sel[d.key]; return !s || !s.length || d.get(item).some(v => s.includes(v)); }));
  if (cfg.mode === 'products'){
    if (cat.price !== null){ const b = PRICE_BANDS[cat.price]; list = list.filter(p => p.price >= b[1] && p.price <= b[2]); }
    if (cat.size) list = list.filter(p => p.sizes.includes(cat.size));
    const sorters = { featured:(a, b) => (b.featured|0) - (a.featured|0) || (b.bestSeller|0) - (a.bestSeller|0) || (b.trending|0) - (a.trending|0) || b.added - a.added, 'price-asc':(a, b) => a.price - b.price, 'price-desc':(a, b) => b.price - a.price, newest:(a, b) => (b.badge === 'New') - (a.badge === 'New') || b.added - a.added, name:(a, b) => a.name.localeCompare(b.name) };
    list = list.slice().sort(sorters[cat.sort] || sorters.featured);
  } else {
    const sorters = { featured:(a, b) => (b.popular|0) - (a.popular|0) || (b.trending|0) - (a.trending|0), name:(a, b) => a.name.localeCompare(b.name) };
    list = list.slice().sort(sorters[cat.sort] || sorters.featured);
  }
  return list;
}
function catActiveCount(){ return Object.values(cat.sel).reduce((s, a) => s + a.length, 0) + (cat.price !== null ? 1 : 0) + (cat.size ? 1 : 0); }

/* ---------- 5. Template components --------------------------------------- */

}

}

function catFilters(cfg){

/* ---------- 6. Structured data + meta per route -------------------------- */
const SITE_URL = 'https://' + SITE.domain;
function catJsonLd(cfg, path){
  const url = SITE_URL + path, list = catBase(cfg);
  const crumbs = [{ name:'Home', item: SITE_URL + '/' }]; if (cfg.parent) crumbs.push({ name: cfg.parent.label, item: SITE_URL + cfg.parent.path }); crumbs.push({ name: cfg.h1, item: url });
  const graph = [
    { '@type':'CollectionPage', '@id': url + '#webpage', url, name: cfg.metaTitle, description: cfg.metaDesc, isPartOf: { '@type':'WebSite', name: SITE.name, url: SITE_URL + '/' }, inLanguage:'en' },
    { '@type':'BreadcrumbList', itemListElement: crumbs.map((c, i) => ({ '@type':'ListItem', position: i + 1, name: c.name, item: c.item })) },
    { '@type':'ItemList', name: cfg.h1, numberOfItems: list.length, itemListElement: list.slice(0, 24).map((x, i) => cfg.mode === 'products'
      ? ({ '@type':'ListItem', position: i + 1, item: { '@type':'Product', name: x.name, url: SITE_URL + '/product/' + x.id, category: CATEGORIES.find(c => c.id === x.category).name, brand: { '@type':'Brand', name: SITE.name }, offers: { '@type':'Offer', price: x.price, priceCurrency: SITE.currency, availability:'https://schema.org/InStock', url: SITE_URL + '/product/' + x.id } } })
      : ({ '@type':'ListItem', position: i + 1, name: x.name + ' tartan', url: SITE_URL + '/tartans/' + x.id })) },
  ];
  if (cfg.faqs && cfg.faqs.length) graph.push({ '@type':'FAQPage', mainEntity: cfg.faqs.map(f => ({ '@type':'Question', name: f.q, acceptedAnswer: { '@type':'Answer', text: f.a } })) });
  return JSON.stringify({ '@context':'https://schema.org', '@graph': graph });
}
function setMeta(name, content, attr = 'name'){ let el = document.head.querySelector(`meta[${attr}="${name}"]`); if (!el){ el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); } el.setAttribute('content', content); }
function catAfterRender(path){
  const cfg = catConfig(path); let ld = document.getElementById('ld-page');
  if (!cfg){ if (ld) ld.remove(); return; }
  document.title = cfg.metaTitle;
  setMeta('description', cfg.metaDesc); setMeta('og:title', cfg.metaTitle, 'property'); setMeta('og:description', cfg.metaDesc, 'property'); setMeta('og:url', SITE_URL + path, 'property');
  let can = document.head.querySelector('link[rel=canonical]'); if (!can){ can = document.createElement('link'); can.rel = 'canonical'; document.head.appendChild(can); } can.href = SITE_URL + path;
  if (!ld){ ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'ld-page'; document.head.appendChild(ld); } ld.textContent = catJsonLd(cfg, path);
  // TOC highlight
  const links = document.querySelectorAll('[data-toc]'); const blocks = document.querySelectorAll('.prose .block');
  if (links.length && 'IntersectionObserver' in window){ const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ links.forEach(l => l.classList.toggle('is-on', l.dataset.toc === e.target.id)); } }), { rootMargin: '-30% 0px -60% 0px' }); blocks.forEach(b => io.observe(b)); }
}
function catRefresh(){
  const cfg = catConfig(cat.path); if (!cfg) return;
  const list = catFiltered(cfg);
  document.getElementById('cat-grid').innerHTML = catGrid(cfg);
  document.getElementById('cat-count').innerHTML = `<strong>${list.length}</strong> ${cfg.mode === 'products' ? (list.length === 1 ? 'kilt' : 'kilts') : (list.length === 1 ? 'tartan' : 'tartans')}`;
  document.getElementById('cat-active').innerHTML = catActiveChips(cfg);
  const fc = document.getElementById('cat-fcount'); if (fc) fc.textContent = catActiveCount() || '';
  document.querySelectorAll('.filters [data-action="cat-filter"]').forEach(b => { const on = (cat.sel[b.dataset.key] || []).includes(b.dataset.val); b.classList.toggle('is-on', on); b.setAttribute('aria-checked', on); });
  document.querySelectorAll('[data-action="cat-price"]').forEach(b => { if (b.closest('.filters')){ const on = cat.price === +b.dataset.val; b.classList.toggle('is-on', on); b.setAttribute('aria-checked', on); } });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'cat-filter'){ const k = el.dataset.key, v = el.dataset.val; const arr = cat.sel[k] || []; cat.sel[k] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; cat.shown = cat.PAGE; catRefresh(); if (el.classList.contains('chip')) document.getElementById('cat-grid').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (a === 'cat-price'){ const i = +el.dataset.val; cat.price = cat.price === i ? null : i; cat.shown = cat.PAGE; catRefresh(); return; }
  if (a === 'cat-size'){ cat.size = cat.size === el.dataset.val ? null : el.dataset.val; cat.shown = cat.PAGE; catRefresh(); return; }
  if (a === 'cat-clear'){ cat.sel = {}; cat.price = null; cat.size = null; cat.shown = cat.PAGE; catRefresh(); return; }
  if (a === 'cat-more'){ cat.shown += cat.PAGE; catRefresh(); return; }
  if (a === 'fgroup'){ const g = el.closest('.fgroup'); const open = g.classList.toggle('is-open'); el.setAttribute('aria-expanded', open); return; }
  if (a === 'filters-open'){ document.getElementById('filters').classList.add('is-open'); document.querySelector('.drawer-backdrop').classList.add('is-open'); document.body.classList.add('no-scroll'); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'cat-sort'){ cat.sort = e.target.value; cat.shown = cat.PAGE; catRefresh(); } });

}
function pdpBuyBar(p, t){
  return `<div class="buybar" id="buybar" aria-hidden="true"><div class="container buybar__inner">${t ? swatch(t, { tileScale: 0.3 }) : kiltVisual(p.visual, { alt: '', noStraps: true })}<div><div class="buybar__name">${esc(p.name)}</div><div class="buybar__meta" id="buybar-meta">${pdp.size ? 'Waist ' + pdp.size + ' · ' + pdp.length : 'Select a waist size'}</div></div><div class="buybar__price">${money(p.price)}</div><button class="btn btn--ink" data-action="pdp-add">Add to cart</button></div></div>`;
}

/* ---------- 5. Details ------------------------------------------------------ */
function sizeChart(){
  return `<div class="spec-wrap"><table class="spec"><thead><tr><th>Size</th><th>Fits waist</th><th>Strap adjustment</th></tr></thead><tbody>${ALL_SIZES.map(s => `<tr><td>${s}</td><td>${s}–${+s + 2} in</td><td>±1 in</td></tr>`).join('')}</tbody></table></div><div class="spec-wrap"><table class="spec"><thead><tr><th>Length</th><th>Waist to knee</th><th>Typical height (guide)</th></tr></thead><tbody>${LENGTHS.map(l => `<tr><td>${l}</td><td>${l}</td><td>${LENGTH_GUIDE[l]}</td></tr>`).join('')}</tbody></table></div>`;
}
function pdpDetails(p, t, copy){
  const items = [
    { id:'description', title:'Description', html: (p.description ? `<p>${esc(p.description)}</p>` : copy.description(p, t)) },
    { id:'specs', title:'Specifications', html: `<div class="spec-wrap"><table class="spec"><tbody>${(p.specs || copy.specs(p, t)).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>` },
    { id:'fit', title:'Size & fit', html: `<p>${esc(copy.fit)}</p><p>Order by your <strong>waist</strong> measurement, not your trouser size — most people need two to three inches more than their jeans. Choose the <strong>length</strong> closest to your waist-to-knee measurement. Full instructions with diagrams in the ${PL('/size-guide','size guide')}.</p>${sizeChart()}` },
    t ? { id:'tartan', title:'About the ' + t.name + ' tartan', html: `<p>${esc(t.description)}</p><p><strong>Family:</strong> ${esc(t.family)} · <strong>Colours:</strong> ${t.colours.join(', ')}. ${t.family === 'Clan' ? 'Anyone may wear a clan tartan; a family link is a reason, not a requirement.' : t.family === 'Universal' ? 'A universal tartan with no family restriction.' : t.family === 'Fashion' ? 'A modern design with no clan affiliation.' : ''}</p><p>${PL('/tartans/' + t.id, 'All kilts in ' + t.name)} · ${PL('/tartans/' + (t.family === 'Clan' ? 'clan' : t.colours[0]), 'More ' + (t.family === 'Clan' ? 'clan' : t.colours[0]) + ' tartans')}</p>` } : null,
    { id:'wear', title:'How to wear it', html: `<p>${esc(copy.wear)}</p><ul>${LOOK_ITEMS[p.category].map(i => `<li>${PL('/accessories/' + i[0], i[1])} — ${i[2]}</li>`).join('')}</ul>` },
    { id:'care', title:'Care', html: `<p>${esc((copy.specs(p, t).find(r => r[0] === 'Care') || [])[1] || 'See the care label.')}. Never tumble-dry a pleated kilt. Store hanging by the straps, or folded along the pleats with the apron outermost, away from direct sunlight.</p>` },
    { id:'shipping', title:'Shipping & returns', html: `<p>Shipping options, delivery estimates and any duties for your destination are shown at checkout before you pay. Our returns and exchange conditions are set out on the ${PL('/returns','Returns')} page — read them before ordering if you are unsure about sizing.</p>` },
  ].filter(Boolean);
  return `<section class="pdp-details" aria-label="Product details"><div class="container pdp-details__grid">
    <div class="pdp-details__side"><h2>Details</h2><p>Cloth, construction, sizing and care for the ${esc(p.name)}.</p>${t ? swatch(t, { tileScale: 0.9 }) : ''}</div>
    <div>${items.map((it, i) => `<div class="dacc${i === 0 ? ' is-open' : ''}" id="d-${it.id}"><h2><button class="dacc__btn" data-action="dacc" aria-expanded="${i === 0}" aria-controls="dp-${it.id}">${esc(it.title)}${ICONS.plus}</button></h2><div class="dacc__panel" id="dp-${it.id}"><div><div class="dacc__body">${it.html}</div></div></div></div>`).join('')}</div>
  </div></section>`;
}

/* ---------- 6. Sections ----------------------------------------------------- */
function pdpLook(p){
  return `<section class="pdp-section section--ivory2" aria-labelledby="look-title"><div class="container"><div class="sec-head"><div><h2 class="h3" id="look-title">Complete the look</h2></div><div class="sec-head__tools"><a class="link" href="${href('/accessories')}">All accessories</a></div></div>
    <div class="look">${LOOK_ITEMS[p.category].map(i => { const a = ACCESSORIES.find(x => x.id === i[0]) || ACCESSORIES[7]; return `<a class="lcard" href="${href(a.path)}"><span class="lcard__icon">${ICONS[a.icon]}</span><span><strong>${esc(i[1])}</strong><span>${esc(i[2])}</span></span><em>Shop</em></a>`; }).join('')}</div></div></section>`;
}
function pdpSiblingRail(p, t){
  const sib = pdpSiblings(p); if (!sib.length) return '';
  return `<section class="pdp-section" aria-labelledby="sib-title"><div class="container"><div class="sec-head"><div><h2 class="h3" id="sib-title">${t ? 'Other tartans in this style' : 'Other colours in this style'}</h2><p class="lede" style="font-size:15px">${esc(CAT_NAME(p.category))} — same build, different ${t ? 'sett' : 'colour'}.</p></div><div class="sec-head__tools"><a class="link" href="${href(CAT_PATH(p.category))}">All ${esc(CAT_NAME(p.category).toLowerCase())}</a>${RailButtons('sib-rail')}</div></div></div><div class="rail-wrap"><div class="rail" id="sib-rail">${sib.map(ProductCard).join('')}</div></div></section>`;
}
function pdpRelatedGrid(p){
  const list = pdpRelated(p);
  return `<section class="pdp-section" aria-labelledby="rel-title"><div class="container"><div class="sec-head"><div><h2 class="h3" id="rel-title">You may also like</h2></div><div class="sec-head__tools"><a class="link" href="${href('/kilts')}">All kilts</a></div></div><div class="pgrid">${list.map(ProductCard).join('')}</div></div></section>`;
}
function pdpReviews(p){
  return `<section class="pdp-section section--ivory2" id="reviews" aria-labelledby="rev-title"><div class="container"><div class="sec-head"><div><h2 class="h3" id="rev-title">Reviews</h2><p class="lede" style="font-size:15px">Verified reviews are collected through our reviews provider after delivery.</p></div></div>
    <div class="rev"><div class="rev__summary"><strong>${p.reviewCount ? p.rating.toFixed(1) : '—'}</strong>${stars(p.rating)}<p>${p.reviewCount ? p.reviewCount + ' verified reviews' : 'No reviews yet'}</p><div class="rev__bars">${[5,4,3,2,1].map(n => `<div class="rev__bar"><span>${n}★</span><i></i><span>0</span></div>`).join('')}</div><button class="btn btn--line btn--sm" data-action="pdp-review">Write a review</button></div>
    <div class="rev__empty"><strong>Be the first to review the ${esc(p.name)}</strong><p>Reviews appear here once customers who bought this kilt submit them. Ratings shown elsewhere on the site stay empty until then — we do not display sample reviews as real ones.</p></div></div></div></section>`;
}
function pdpFAQ(p){
  const cfg = CATEGORY_PAGES[CAT_PATH(p.category)]; if (!cfg || !cfg.faqs) return '';
  const faqs = cfg.faqs.slice(0, 4);
  return `<section class="pdp-section" aria-labelledby="pfaq-title"><div class="container pfaq"><div><h2 class="h3" id="pfaq-title">${esc(CAT_NAME(p.category))} questions</h2><p class="lede" style="font-size:15px">More in the ${PL(CAT_PATH(p.category), 'category guide')} and the ${PL('/#faq','full FAQ')}.</p></div><div class="faq" style="margin:0;max-width:none">${faqs.map((f, i) => `<div class="faq__item"><h3><button class="faq__q" data-action="faq" aria-expanded="false" aria-controls="pfaq-${i}">${esc(f.q)}${ICONS.plus}</button></h3><div class="faq__a" id="pfaq-${i}"><div><p>${esc(f.a)}</p></div></div></div>`).join('')}</div></div></section>`;
}
function pdpRecent(p){
  const ids = recent().filter(id => id !== p.id).map(productById).filter(Boolean).slice(0, 8); if (!ids.length) return '';
  return `<section class="pdp-section section--ivory2" aria-labelledby="recent-title"><div class="container"><div class="sec-head"><div><h2 class="h3" id="recent-title">Recently viewed</h2></div><div class="sec-head__tools">${RailButtons('recent-rail')}</div></div></div><div class="rail-wrap"><div class="rail" id="recent-rail">${ids.map(ProductCard).join('')}</div></div></section>`;
}

/* ---------- 7. Page ---------------------------------------------------------- */
function ProductPage(p, path){
  if (pdp.id !== p.id) pdpReset(p.id);
  const t = p.tartan ? tartanById(p.tartan) : null; const copy = PDP_COPY[p.category]; const slides = pdpSlides(p, t);
  const crumbs = `<nav class="crumbs" aria-label="Breadcrumb"><a href="${href('/')}">Home</a><span>/</span><a href="${href('/kilts')}">Kilts</a><span>/</span><a href="${href(CAT_PATH(p.category))}">${esc(CAT_NAME(p.category))}</a><span>/</span><span aria-current="page">${esc(p.name)}</span></nav>`;
  return `<main class="page pdp" id="main" data-product="${p.id}">
    <div class="container">${crumbs}<div class="pdp-top">${pdpGallery(p, t, slides)}${pdpBuy(p, t, copy)}</div></div>
    ${pdpDetails(p, t, copy)}
    ${pdpLook(p)}
    ${pdpSiblingRail(p, t)}
    ${pdpRelatedGrid(p)}
    ${pdpReviews(p)}
    ${pdpFAQ(p)}
    ${pdpRecent(p)}
    ${pdpBuyBar(p, t)}
  </main>`;
}

/* ---------- 8. Structured data + meta --------------------------------------- */
function pdpJsonLd(p, t, copy){
  const url = SITE_URL + '/product/' + p.id;
  const product = { '@type':'Product', '@id': url + '#product', name: p.name, sku: p.sku || ('SK-' + p.id.toUpperCase()), url, description: copy.short(p, t), brand: { '@type':'Brand', name: SITE.name }, category: CAT_NAME(p.category), color: (t ? t.colours : [colourOf(p)]).join(', '), material: (copy.specs(p, t).find(r => ['Cloth','Leather'].includes(r[0])) || [])[1],
    additionalProperty: copy.specs(p, t).filter(r => ['Yardage','Pleating','Closure','Pockets','Weight'].includes(r[0])).map(r => ({ '@type':'PropertyValue', name: r[0], value: r[1] })),
    offers: { '@type':'Offer', url, price: p.price, priceCurrency: SITE.currency, availability:'https://schema.org/InStock', itemCondition:'https://schema.org/NewCondition', seller: { '@type':'Organization', name: SITE.name } } };
  if (t) product.pattern = t.name + ' tartan';
  if (p.gallery && p.gallery.length) product.image = p.gallery.map(g => g.src);
  if (p.reviewCount) product.aggregateRating = { '@type':'AggregateRating', ratingValue: p.rating, reviewCount: p.reviewCount };
  const crumbs = { '@type':'BreadcrumbList', itemListElement: [['Home', '/'], ['Kilts', '/kilts'], [CAT_NAME(p.category), CAT_PATH(p.category)], [p.name, '/product/' + p.id]].map((c, i) => ({ '@type':'ListItem', position: i + 1, name: c[0], item: SITE_URL + c[1] })) };
  return JSON.stringify({ '@context':'https://schema.org', '@graph':[product, crumbs] });
}
function pdpMeta(p, t, copy){
  let title = `${p.name} | ${t ? t.name + ' Tartan | ' : ''}SCOTKILT`; if (title.length > 65) title = `${p.name} | SCOTKILT`;
  let desc = `${p.name}: ${copy.short(p, t).replace(/<[^>]+>/g, '')} Waist 28–50, lengths 22–26". ${money(p.price)}.`;
  if (desc.length > 160) desc = desc.slice(0, 157).replace(/\s+\S*$/, '') + '…';
  return { title, desc };
}
function pdpAfterRender(path){
  const main = document.querySelector('main.pdp'); if (!main) return;
  const p = productById(main.dataset.product), t = p.tartan ? tartanById(p.tartan) : null, copy = PDP_COPY[p.category];
  const m = pdpMeta(p, t, copy); document.title = m.title; setMeta('description', m.desc); setMeta('og:title', m.title, 'property'); setMeta('og:description', m.desc, 'property'); setMeta('og:url', SITE_URL + path, 'property'); setMeta('og:type', 'product', 'property');
  let can = document.head.querySelector('link[rel=canonical]'); if (!can){ can = document.createElement('link'); can.rel = 'canonical'; document.head.appendChild(can); } can.href = SITE_URL + path;
  let ld = document.getElementById('ld-page'); if (!ld){ ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'ld-page'; document.head.appendChild(ld); } ld.textContent = pdpJsonLd(p, t, copy);
  pushRecent(p.id);
  // sticky buy bar: show once the main CTA has scrolled out of view
  const cta = document.querySelector('.pdp-cta'), bar = document.getElementById('buybar');
  if (cta && bar && 'IntersectionObserver' in window){ const io = new IntersectionObserver(es => es.forEach(e => { const show = !e.isIntersecting && e.boundingClientRect.top < 0; bar.classList.toggle('is-on', show); bar.setAttribute('aria-hidden', !show); })); io.observe(cta); }
}

/* ---------- 9. Events ------------------------------------------------------- */
function pdpSetSlide(i){
  const slides = document.querySelectorAll('.pdp-main__slide'); if (!slides.length) return; pdp.slide = (i + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle('is-on', k === pdp.slide));
  document.querySelectorAll('.pdp-thumb').forEach((b, k) => { b.classList.toggle('is-on', k === pdp.slide); b.setAttribute('aria-selected', k === pdp.slide); });
  const cap = document.getElementById('pdp-cap'); if (cap) cap.textContent = slides[pdp.slide].dataset.cap || '';
}
function pdpSyncMeta(){
  const l = document.getElementById('pdp-size-label'); if (l) l.textContent = pdp.size ? 'Waist ' + pdp.size + ' in' : 'Select a size';
  const ll = document.getElementById('pdp-length-label'); if (ll) ll.textContent = pdp.length + ' · ' + LENGTH_GUIDE[pdp.length];
  const bm = document.getElementById('buybar-meta'); if (bm) bm.textContent = pdp.size ? 'Waist ' + pdp.size + ' · ' + pdp.length : 'Select a waist size';
  const q = document.getElementById('pdp-qty'); if (q) q.textContent = pdp.qty;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return; const a = el.dataset.action;
  if (a === 'pdp-slide'){ pdpSetSlide(+el.dataset.i); return; }
  if (a === 'pdp-nav'){ pdpSetSlide(pdp.slide + +el.dataset.d); return; }
  if (a === 'pdp-size'){ pdp.size = pdp.size === el.dataset.val ? null : el.dataset.val; document.querySelectorAll('#pdp-sizes .size').forEach(b => { const on = b.dataset.val === pdp.size; b.classList.toggle('is-on', on); b.setAttribute('aria-checked', on); }); document.getElementById('pdp-sizes').classList.remove('is-error'); document.getElementById('pdp-size-hint').classList.remove('is-error'); pdpSyncMeta(); return; }
  if (a === 'pdp-length'){ pdp.length = el.dataset.val; document.querySelectorAll('.lengths .size').forEach(b => { const on = b.dataset.val === pdp.length; b.classList.toggle('is-on', on); b.setAttribute('aria-checked', on); }); pdpSyncMeta(); return; }
  if (a === 'pdp-qty'){ pdp.qty = Math.min(10, Math.max(1, pdp.qty + +el.dataset.d)); pdpSyncMeta(); return; }
  if (a === 'pdp-add'){
    const p = productById(pdp.id); if (!p) return;
    if (!pdp.size){ const s = document.getElementById('pdp-sizes'), h = document.getElementById('pdp-size-hint'); s.classList.add('is-error'); h.classList.add('is-error'); h.textContent = 'Choose a waist size to add this kilt to your cart.'; s.scrollIntoView({ behavior:'smooth', block:'center' }); toast('Select a waist size first'); return; }
    const row = state.cart.find(r => r.id === p.id && r.size === pdp.size && r.length === pdp.length); if (row) row.qty += pdp.qty; else state.cart.push({ id: p.id, qty: pdp.qty, size: pdp.size, length: pdp.length });
    refreshCart(); toast(`Added ${p.name} (waist ${pdp.size}, ${pdp.length}) to cart`); closeAll(); openCart(); return; }
  if (a === 'dacc'){ const d = el.closest('.dacc'); const open = d.classList.toggle('is-open'); el.setAttribute('aria-expanded', open); return; }
  if (a === 'pdp-share'){ const url = location.href; if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copied')).catch(() => toast(url)); else toast(url); return; }
  if (a === 'pdp-review'){ toast('Reviews connect to your reviews provider at launch'); return; }
});
document.addEventListener('keydown', e => { if (!document.querySelector('main.pdp') || e.target.closest('input,select,textarea')) return; if (e.key === 'ArrowRight') pdpSetSlide(pdp.slide + 1); if (e.key === 'ArrowLeft') pdpSetSlide(pdp.slide - 1); });

</script>
</body>
</html>
